version: 1.0.{build}

image: Visual Studio 2022

branches:
  only:
    - main

environment:
  JAVA_HOME: C:\Program Files\Java\jdk17
  ANDROID_HOME: C:\android-sdk
  ANDROID_SDK_ROOT: C:\android-sdk
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs="-Xmx2048m -Dfile.encoding=UTF-8"

install:
  - ps: |
      $sdkRoot = $env:ANDROID_HOME
      if (-not (Test-Path "$sdkRoot\cmdline-tools\latest\bin\sdkmanager.bat") -and (Test-Path "C:\Android\android-sdk\cmdline-tools\latest\bin\sdkmanager.bat")) {
        $sdkRoot = "C:\Android\android-sdk"
      }
      if (-not (Test-Path "$sdkRoot\cmdline-tools\latest\bin\sdkmanager.bat")) {
        $toolsZip = "$env:TEMP\android-commandlinetools.zip"
        $toolsTemp = "$env:TEMP\android-commandlinetools"
        New-Item -ItemType Directory -Force -Path "$sdkRoot\cmdline-tools" | Out-Null
        Invoke-WebRequest -Uri "https://dl.google.com/android/repository/commandlinetools-win-11076708_latest.zip" -OutFile $toolsZip
        if (Test-Path $toolsTemp) {
          Remove-Item -Recurse -Force $toolsTemp
        }
        Expand-Archive -Path $toolsZip -DestinationPath $toolsTemp
        Move-Item -Force "$toolsTemp\cmdline-tools" "$sdkRoot\cmdline-tools\latest"
      }
      $env:ANDROID_HOME = $sdkRoot
      $env:ANDROID_SDK_ROOT = $sdkRoot
      "sdk.dir=$($sdkRoot.Replace('\', '/'))" | Out-File -Encoding ASCII local.properties
      echo y | & "$sdkRoot\cmdline-tools\latest\bin\sdkmanager.bat" "platforms;android-34" "build-tools;34.0.0" "platform-tools"
      echo y | & "$sdkRoot\cmdline-tools\latest\bin\sdkmanager.bat" --licenses

build_script:
  - cmd: gradlew.bat clean testDebugUnitTest assembleDebug

artifacts:
  - path: app\build\outputs\apk\debug\app-debug.apk
    name: app-debug

cache:
  - C:\Users\appveyor\.gradle\caches -> **\*.gradle, **\*.gradle.kts, gradle.properties
  - C:\Users\appveyor\.gradle\wrapper -> gradle\wrapper\gradle-wrapper.properties
  - C:\android-sdk\build-tools -> appveyor.yml
  - C:\android-sdk\cmdline-tools -> appveyor.yml
  - C:\android-sdk\licenses -> appveyor.yml
  - C:\android-sdk\platform-tools -> appveyor.yml
  - C:\android-sdk\platforms -> appveyor.yml
